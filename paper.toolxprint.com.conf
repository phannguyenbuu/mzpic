server {
    listen 80;
    server_name paper.toolxprint.com;
    root /var/www/paper.toolxprint.com/dist;
    index index.html;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ToolXPrint GenAI API Hub
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # AgentAPI QuanLyMay Central Integration (Settings, Prompts, Users, Auth)
    location /agent-api/ {
        proxy_pass http://127.0.0.1:8005/;
        proxy_http_version 1.1;
        proxy_set_header Host agentapi.quanlymay.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # Generated Images
    location /images/ {
        alias /var/www/images/;
        autoindex on;
        add_header Access-Control-Allow-Origin * always;
    }

    # Render Bridge endpoints
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_set_header Host $host;
    }

    location /render-job {
        proxy_pass http://127.0.0.1:8080/render-job;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }

    location /render-jobs {
        proxy_pass http://127.0.0.1:8080/render-jobs;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }
}
